# ==============================================================
# AISecGuard — Docker Compose (Week 3 Fixed)
# Development environment: PostgreSQL + FastAPI Backend
# ==============================================================
# Usage:
#   docker-compose up -d db        # Start PostgreSQL only
#   docker-compose up -d           # Start all services
#   docker-compose down            # Stop all services
#   docker-compose down -v         # Stop and remove volumes
# ==============================================================

version: "3.9"

services:

  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: aisecguard_db
    environment:
      POSTGRES_USER: aisecguard
      POSTGRES_PASSWORD: aisecguard_password
      POSTGRES_DB: aisecguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisecguard -d aisecguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- FastAPI Backend ---
  backend:
    build:
      context: .              # Project root — allows COPY requirements.txt to work
      dockerfile: backend/Dockerfile
    container_name: aisecguard_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://aisecguard:aisecguard_password@db:5432/aisecguard
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: 100
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    name: aisecguard_postgres_data
  upload_data:
    name: aisecguard_upload_data
