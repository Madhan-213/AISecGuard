# ==============================================================================
# AISecGuard — Docker Compose Stack
#
# Quickstart (Frontend UI + FastAPI Backend on Port 8000):
#   docker compose up -d
#   Visit: http://localhost:8000
#c
# Stop and remove containers:
#   docker compose down
#
# Clean up containers and persistent data volumes:
#   docker compose down -v
# ==============================================================================

version: '3.8'

services:

  # ----------------------------------------------------------------------------
  # AISecGuard Full-Stack Application
  # (Unified React SPA Frontend + FastAPI Backend + Static Security Scanners)
  # ----------------------------------------------------------------------------
  aisecguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aisecguard_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NO_LOGIN_REQUIRED=true # Set to 'false' to enforce enterprise multi-user JWT login
      - RATE_LIMIT_ENABLED=true
      - OSV_LOOKUP_ENABLED=true
      - DATABASE_URL=sqlite:////app/uploads/aisecguard.db
      - SECRET_KEY=${SECRET_KEY:-aisecguard_production_secret_key_change_me}
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=100
    volumes:
      - upload_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Optional Enterprise Production Store)
  # Run with: docker compose --profile postgres up -d
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: aisecguard_postgres
    profiles: [ "postgres" ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisecguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisecguard_password}
      POSTGRES_DB: ${POSTGRES_DB:-aisecguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aisecguard -d aisecguard" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  upload_data:
    name: aisecguard_upload_data
  postgres_data:
    name: aisecguard_postgres_data
